<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Надежда Эльфенбайн — визитка</title>
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #d4af37;
    --gold-light: #f5d97a;
    --gold-dark: #8a6d1e;
    --text: #f3ead3;
    --muted: #a89f8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* Мерцающие золотые частицы на фоне */
  #sparkles {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .scene { perspective: 1200px; position: relative; z-index: 1; width: 100%; max-width: 460px; }

  /* Карточка с вращающейся золотой рамкой */
  .card {
    position: relative;
    border-radius: 24px;
    padding: 3px;
    background: conic-gradient(from var(--angle, 0deg),
      var(--gold-dark), var(--gold-light), var(--gold), var(--gold-dark),
      var(--gold-light), var(--gold-dark));
    animation: spin 6s linear infinite;
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    box-shadow: 0 0 40px rgba(212, 175, 55, 0.18), 0 20px 60px rgba(0, 0, 0, 0.8);
    opacity: 0;
    animation: spin 6s linear infinite, appear 1s 0.1s ease forwards;
  }
  @property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin { to { --angle: 360deg; } }
  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-inner {
    position: relative;
    border-radius: 21px;
    background:
      radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.12), transparent 60%),
      var(--bg);
    padding: 48px 32px 40px;
    text-align: center;
    overflow: hidden;
  }
  /* Внутренняя тонкая рамка */
  .card-inner::before {
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid rgba(212, 175, 55, 0.25);
    border-radius: 14px;
    pointer-events: none;
  }
  /* Блик, следующий за курсором */
  .glare {
    position: absolute; inset: 0;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%),
      rgba(245, 217, 122, 0.15), transparent 45%);
    pointer-events: none;
  }

  .avatar {
    width: 140px; height: 140px;
    margin: 0 auto 24px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    animation: float 4s ease-in-out infinite;
  }
  .avatar img {
    display: block;
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--bg);
    transition: transform 0.4s ease;
  }
  .avatar:hover img { transform: scale(1.05); }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 8vw, 2.8rem);
    font-weight: 700;
    line-height: 1.15;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), #fff6d5, var(--gold-light), var(--gold-dark));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
    filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.45));
  }
  @keyframes shine { to { background-position: 200% center; } }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 20px auto;
    max-width: 220px;
    color: var(--gold);
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .divider::after { background: linear-gradient(90deg, var(--gold), transparent); }

  .role {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .bio {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto;
  }

  /* Соцсети */
  .socials {
    display: flex; justify-content: center; gap: 16px;
    margin: 32px 0;
  }
  .social {
    position: relative;
    width: 52px; height: 52px;
    border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid rgba(212, 175, 55, 0.5);
    color: var(--gold);
    text-decoration: none;
    transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
  }
  .social svg { width: 24px; height: 24px; transition: transform 0.3s ease; }
  .social:hover, .social:focus-visible {
    transform: translateY(-5px);
    background: var(--gold);
    color: var(--bg);
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
    outline: none;
  }
  .social:hover svg { transform: rotate(-12deg) scale(1.1); }
  .social .tip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    padding: 4px 10px;
    border-radius: 6px;
    background: #1a1712;
    border: 1px solid rgba(212, 175, 55, 0.4);
    color: var(--gold-light);
    font-size: 0.75rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  .social:hover .tip, .social:focus-visible .tip { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Кнопка «Написать мне» */
  .btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 36px;
    border-radius: 999px;
    font-size: 1rem; font-weight: 600; letter-spacing: 0.5px;
    color: var(--bg);
    text-decoration: none;
    background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
    background-size: 200% 200%;
    overflow: hidden;
    box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.6);
    animation: pulse 2.4s ease-out infinite;
    transition: transform 0.25s ease, background-position 0.5s ease;
  }
  .btn::before {
    content: "";
    position: absolute; top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    transform: skewX(-20deg);
    animation: sweep 3s ease-in-out infinite;
  }
  .btn svg { width: 20px; height: 20px; transition: transform 0.3s ease; }
  .btn:hover { transform: translateY(-3px) scale(1.03); background-position: 100% 100%; }
  .btn:hover svg { transform: translateX(4px) rotate(-10deg); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 4px; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.55); }
    70%  { box-shadow: 0 0 0 18px rgba(212, 175, 55, 0); }
    100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
  }
  @keyframes sweep {
    0%, 60% { left: -75%; }
    100% { left: 130%; }
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    transform: scale(0);
    animation: ripple 0.6s linear;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  .footer {
    margin-top: 28px;
    font-size: 0.75rem;
    color: rgba(168, 159, 138, 0.6);
    letter-spacing: 2px;
  }

  @media (max-width: 480px) {
    .card-inner { padding: 40px 20px 32px; }
    .avatar { width: 120px; height: 120px; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { opacity: 1; }
  }
</style>
</head>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // 3D-наклон карточки и блик за курсором
  const card = document.getElementById('card');
  const inner = card.querySelector('.card-inner');
  const canHover = window.matchMedia('(hover: hover)').matches;
  if (canHover) {
    card.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      card.style.transform = `rotateY(${(x - 0.5) * 12}deg) rotateX(${(0.5 - y) * 12}deg)`;
      inner.style.setProperty('--gx', `${x * 100}%`);
      inner.style.setProperty('--gy', `${y * 100}%`);
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
      inner.style.setProperty('--gx', '50%');
      inner.style.setProperty('--gy', '0%');
    });
  }

  // Волна при нажатии на кнопку
  document.getElementById('contactBtn').addEventListener('click', function (e) {
    const r = this.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - r.left - size / 2) + 'px';
    span.style.top = (e.clientY - r.top - size / 2) + 'px';
    this.appendChild(span);
    setTimeout(() => span.remove(), 600);
  });

  // Золотые частицы на фоне
  const canvas = document.getElementById('sparkles');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, particles = [];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(80, Math.floor((w * h) / 14000));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.6 + 0.3,
      vy: -(Math.random() * 0.3 + 0.05),
      vx: (Math.random() - 0.5) * 0.15,
      phase: Math.random() * Math.PI * 2
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
      const a = 0.3 + 0.5 * Math.abs(Math.sin(t / 1000 + p.phase));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(232, 197, 90, ${a})`;
      ctx.shadowColor = 'rgba(232, 197, 90, 0.8)';
      ctx.shadowBlur = 6;
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
